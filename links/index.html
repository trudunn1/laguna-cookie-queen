<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laguna Cookie Queen | Links</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #FFF8F0 0%, #FDE8D8 30%, #E8D5C4 70%, #D4C4B0 100%);
            background-attachment: fixed;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating cookies background */
        body::before {
            content: '🍪';
            position: fixed;
            top: 10%;
            left: 5%;
            font-size: 24px;
            opacity: 0.15;
            animation: float1 6s ease-in-out infinite;
        }
        body::after {
            content: '🍪';
            position: fixed;
            top: 30%;
            right: 8%;
            font-size: 18px;
            opacity: 0.12;
            animation: float2 8s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        @keyframes float2 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-8deg); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1B2A4A;
            box-shadow: 0 8px 30px rgba(27, 42, 74, 0.15);
            margin-bottom: 16px;
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: #1B2A4A;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 14px;
            color: #6B7B8D;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .location {
            font-size: 13px;
            color: #8B9AAD;
            margin-bottom: 28px;
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .link-btn:hover::after {
            left: 100%;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .link-btn:active {
            transform: translateY(0);
        }

        .link-btn .emoji {
            font-size: 20px;
        }

        /* Primary — Order */
        .link-primary {
            background: #1B2A4A;
            color: #FFFAF5;
            box-shadow: 0 4px 15px rgba(27, 42, 74, 0.25);
        }

        /* Secondary links */
        .link-secondary {
            background: rgba(255, 255, 255, 0.75);
            color: #1B2A4A;
            border: 1.5px solid rgba(27, 42, 74, 0.12);
            backdrop-filter: blur(10px);
        }
        .link-secondary:hover {
            background: rgba(255, 255, 255, 0.95);
        }

        /* Instagram gradient */
        .link-instagram {
            background: linear-gradient(135deg, #833AB4, #C13584, #E1306C, #F77737);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(193, 53, 132, 0.3);
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: #8B9AAD;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: -4px;
            margin-top: 8px;
        }

        .footer {
            margin-top: auto;
            padding-top: 24px;
            text-align: center;
        }

        .footer a {
            font-size: 12px;
            color: #A0AEC0;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .footer a:hover {
            color: #1B2A4A;
        }

        /* Mobile tweaks */
        @media (max-width: 380px) {
            .name { font-size: 22px; }
            .link-btn { padding: 14px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../images/logo.png" alt="Laguna Cookie Queen" class="avatar">
        <div class="name">Laguna Cookie Queen</div>
        <div class="tagline">Cookies with a little couture</div>
        <div class="location">📍 Laguna Beach, CA</div>

        <div class="links">
            <!-- Website -->
            <a href="https://lagunacookiequeen.com" class="link-btn link-secondary" target="_blank">
                <span class="emoji">🌐</span> Our Website
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/lagunacookiequeen" class="link-btn link-instagram" target="_blank">
                <span class="emoji">📸</span> Follow on Instagram
            </a>

            <!-- Venmo -->
            <a href="https://venmo.com/" class="link-btn link-primary" target="_blank">
                <span class="emoji">💳</span> Pay with Venmo
            </a>
        </div>

        <div class="footer">
            <a href="https://trudunn1.github.io/laguna-cookie-queen/">lagunacookiequeen.com</a>
        </div>
    </div>
</body>
</html>
